[package]
name = "cocokie"
version = "0.1.0"
edition = "2024"
description = "Extract selected browser cookies via yt-dlp's cookie extractor"

[dependencies]
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror  = "2"
dirs       = "7"

[dev-dependencies]
anyhow  = "1.0.104"
reqwest = { version = "0.13.5", default-features = false, features = [
    "blocking",
    "cookies",
    "json",
    "query",
    "native-tls",
] }
